<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Weather-Web</title>

    <link rel="stylesheet" href="./style.css">


    <!-- Font Awesome  -->
    <script src="https://kit.fontawesome.com/98c9c535e9.js" crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">

        <div class="weather-input">

            <div class="input-group">
                <input type="text" id="userLocation" placeholder="Search for places....">

                <select class="converter" id="converter">
                    <option value="">C</option>
                    <option value="">F</option>
                </select>

                <i class="fa fa-search" onclick="findUserLocation()"></i>

            </div>

            <div class="weatherIcon"> </div>
            <h2 class="temperature"></h2>
            <div class="feelsLike"> </div>
            <div class="description"></div>
            <hr>
            <div class="date"></div>
            <p class="date"><span id="dateTimeValue"></span></p>
            <div class="city"></div>

        </div>

        <!-- weather-output  -->
        <div class="weather-output">
            <h2 class="heading">Today's Highlights</h2>
            <div class="Highligh">
                <div class="humidity">
                    humidity
                    <i class="fa-solid fa-water"></i>
                    <h1 id="Hvalue"></h1>
                </div>

                <div class="wind-speed">
                    Wind Speed
                    <i class="fa-solid fa-wind"></i>
                    <h1 id="Wvalue"></h1>
                </div>

                <div class="sun">
                    <span>
                        <i class="fa-solid fa-sun"></i>
                        <p><span id="SRValue"></span>Sunrise</p>
                    </span>

                    <span>
                        <i class="fa-regular fa-sun"></i>
                        <p><span id="SSValue"></span>Sunset</p>
                    </span>
                </div>

                <div class="clouds">
                    Clouds
                    <i class="fa-solid fa-cloud"></i>
                    <h1 id="Cvalue"></h1>
                </div>

                <div class="uv-index">
                    UV Index
                    <i class="fa-solid fa-bacon"></i>
                    <h1 id="UVvalue"></h1>
                </div>

                <div class="pressure">
                    Pressure
                    <i class="fa-solid fa-volcano"></i>
                    <h1 id="Pvalue"></h1>
                </div>


            </div>

            <br>


            <h2 class="heading">This Week</h2>
            <!-- <div class="Forecast"></div> -->
            <div id="forecastContainer"></div>


        </div>

    </div>






    <script defer src="./script.js"></script>
    <!-- <script src="./look.js"></script> -->
</body>

</html>
